name: Publish stable release

on:
  push:
    branches: [main]
    paths:
      - meta.json
      - src/Jellyfin.Plugin.Zipper/Jellyfin.Plugin.Zipper.csproj
  workflow_dispatch:

permissions: {}

concurrency:
  group: zipper-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Build and prepare stable release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.preflight.outputs.publish }}
      version: ${{ steps.preflight.outputs.version }}
      tag: ${{ steps.preflight.outputs.tag }}
      sha: ${{ steps.preflight.outputs.sha }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release eligibility
        id: preflight
        env:
          ZIPPER_EVENT_NAME: ${{ github.event_name }}
          ZIPPER_REF: ${{ github.ref }}
          ZIPPER_SHA: ${{ github.sha }}
          ZIPPER_BEFORE: ${{ github.event.before }}
          ZIPPER_REPOSITORY: ${{ github.repository }}
          ZIPPER_GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const repository = process.env.ZIPPER_REPOSITORY;
          const sha = process.env.ZIPPER_SHA;
          const ref = process.env.ZIPPER_REF;
          const eventName = process.env.ZIPPER_EVENT_NAME;
          const token = process.env.ZIPPER_GH_TOKEN;
          const output = process.env.GITHUB_OUTPUT;

          function fail(message) {
            throw new Error(message);
          }

          function setOutput(name, value) {
            appendFileSync(output, `${name}=${value}\n`);
          }

          async function getApi(path) {
            const suffix = path ? `/${path}` : '';
            const response = await fetch(`https://api.github.com/repos/${repository}${suffix}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (response.status === 404) {
              return null;
            }
            if (!response.ok) {
              fail(`GitHub API request failed with HTTP ${response.status}`);
            }
            return response.json();
          }

          async function getTagCommit(tag) {
            const reference = await getApi(`git/ref/tags/${encodeURIComponent(tag)}`);
            if (!reference) {
              return null;
            }
            let target = reference.object;
            let depth = 0;
            while (target?.type === 'tag') {
              if (depth >= 5) {
                fail(`Tag ${tag} has too many annotated tag layers.`);
              }
              const annotatedTag = await getApi(`git/tags/${target.sha}`);
              if (!annotatedTag) {
                fail(`Annotated tag ${tag} could not be resolved.`);
              }
              target = annotatedTag.object;
              depth += 1;
            }
            if (target?.type !== 'commit' || typeof target.sha !== 'string') {
              fail(`Tag ${tag} does not resolve to a commit.`);
            }
            return target.sha;
          }

          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository ?? '')) {
            fail('GitHub repository identity is invalid.');
          }
          if (!/^[a-f0-9]{40,64}$/i.test(sha ?? '')) {
            fail('The triggering commit SHA is invalid.');
          }
          if (eventName === 'workflow_dispatch' && ref !== 'refs/heads/main') {
            fail('Stable release retries are allowed only from main.');
          }
          if (eventName === 'push' && ref !== 'refs/heads/main') {
            fail('Automatic stable releases are allowed only from main.');
          }
          if (eventName !== 'push' && eventName !== 'workflow_dispatch') {
            fail(`Unsupported release event: ${eventName}`);
          }

          const checkedOutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (checkedOutSha.toLowerCase() !== sha.toLowerCase()) {
            fail(`Checked out ${checkedOutSha}, expected triggering commit ${sha}.`);
          }

          const metadata = JSON.parse(readFileSync('meta.json', 'utf8'));
          const projectText = readFileSync('src/Jellyfin.Plugin.Zipper/Jellyfin.Plugin.Zipper.csproj', 'utf8');
          const projectVersion = projectText.match(/<Version>\s*([^<\s]+)\s*<\/Version>/)?.[1];
          const version = metadata.version;
          if (typeof version !== 'string' || !/^\d+\.\d+\.\d+\.\d+$/.test(version)) {
            fail('meta.json version must have four numeric components.');
          }
          if (projectVersion !== version) {
            fail(`meta.json version ${version} does not match project version ${projectVersion ?? '(missing)'}.`);
          }

          let versionChanged = eventName === 'workflow_dispatch';
          if (eventName === 'push') {
            const before = process.env.ZIPPER_BEFORE;
            if (/^0+$/.test(before ?? '')) {
              versionChanged = true;
            } else {
              if (!/^[a-f0-9]{40,64}$/i.test(before ?? '')) {
                fail('The push event does not contain a valid previous commit SHA.');
              }
              try {
                execFileSync('git', ['cat-file', '-e', `${before}^{commit}`], { stdio: 'ignore' });
              } catch {
                fail('The previous main commit is unavailable, so the version change cannot be verified.');
              }
              let previousVersion;
              try {
                execFileSync('git', ['cat-file', '-e', `${before}:meta.json`], { stdio: 'ignore' });
                const previousMetadata = JSON.parse(execFileSync('git', ['show', `${before}:meta.json`], { encoding: 'utf8' }));
                previousVersion = previousMetadata.version;
              } catch {
                previousVersion = undefined;
              }
              versionChanged = previousVersion !== version;
            }
          }

          const tag = `v${version}`;
          setOutput('version', version);
          setOutput('tag', tag);
          setOutput('sha', sha);

          if (!versionChanged) {
            console.log(`Version ${version} did not change on main; release skipped.`);
            setOutput('publish', 'false');
            process.exit(0);
          }

          const release = await getApi(`releases/tags/${encodeURIComponent(tag)}`);
          if (release && !release.draft) {
            console.log(`Version ${version} is already published; release skipped.`);
            setOutput('publish', 'false');
            process.exit(0);
          }

          const taggedCommit = await getTagCommit(tag);
          if (release && !taggedCommit) {
            fail(`Draft release ${tag} has no resolvable Git tag.`);
          }
          if (taggedCommit && taggedCommit.toLowerCase() !== sha.toLowerCase()) {
            fail(`Tag ${tag} resolves to ${taggedCommit}, not triggering commit ${sha}.`);
          }

          setOutput('publish', 'true');
          console.log(`Version ${version} is eligible for a stable release from ${sha}.`);
          NODE

      - name: Set up .NET 10
        if: steps.preflight.outputs.publish == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build plugin
        if: steps.preflight.outputs.publish == 'true'
        run: dotnet build src/Jellyfin.Plugin.Zipper/Jellyfin.Plugin.Zipper.csproj --configuration Release

      - name: Check formatting
        if: steps.preflight.outputs.publish == 'true'
        run: dotnet format Zipper.sln --verify-no-changes

      - name: Set up Node.js
        if: steps.preflight.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check JavaScript
        if: steps.preflight.outputs.publish == 'true'
        run: |
          node --check scripts/package.mjs
          node --check src/Jellyfin.Plugin.Zipper/Web/zipper.js
          node --check src/Jellyfin.Plugin.Zipper/Web/zipper.i18n.js
          node -e "const html = require('node:fs').readFileSync('src/Jellyfin.Plugin.Zipper/Configuration/config.html', 'utf8'); new (require('node:vm').Script)(html.match(/<script>([\\s\\S]*?)<\\/script>/)[1]);"

      - name: Validate JSON metadata and translations
        if: steps.preflight.outputs.publish == 'true'
        run: node -e "for (const path of ['meta.json', 'manifest.json', 'src/Jellyfin.Plugin.Zipper/Web/locales/en.json', 'src/Jellyfin.Plugin.Zipper/Web/locales/pl.json']) JSON.parse(require('node:fs').readFileSync(path, 'utf8'))"

      - name: Fetch the latest stable catalog history
        id: previous
        if: steps.preflight.outputs.publish == 'true'
        env:
          ZIPPER_REPOSITORY: ${{ github.repository }}
          ZIPPER_GH_TOKEN: ${{ github.token }}
          ZIPPER_PREVIOUS_MANIFEST: ${{ runner.temp }}/zipper-release/previous-manifest.json
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';

          const repository = process.env.ZIPPER_REPOSITORY;
          const token = process.env.ZIPPER_GH_TOKEN;

          async function getApi(path) {
            const suffix = path ? `/${path}` : '';
            const response = await fetch(`https://api.github.com/repos/${repository}${suffix}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (response.status === 404) {
              return null;
            }
            if (!response.ok) {
              throw new Error(`GitHub API request failed with HTTP ${response.status}`);
            }
            return response.json();
          }

          const repositoryInfo = await getApi('');
          if (!repositoryInfo || repositoryInfo.full_name.toLowerCase() !== repository.toLowerCase()) {
            throw new Error('GitHub repository could not be verified before reading release history.');
          }
          const release = await getApi('releases/latest');
          if (!release) {
            console.log('No published stable release exists yet; this is the first catalog entry.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'has_previous=false\n');
            process.exit(0);
          }
          if (release.draft || release.prerelease) {
            throw new Error('The latest stable release endpoint returned a draft or prerelease.');
          }

          const assets = release.assets.filter((asset) => asset.name === 'manifest.json' && asset.state === 'uploaded');
          if (assets.length !== 1) {
            throw new Error(`Latest stable release ${release.tag_name} must contain exactly one uploaded manifest.json asset.`);
          }
          const asset = assets[0];
          const expectedAssetUrl = `https://api.github.com/repos/${repository}/releases/assets/${asset.id}`;
          if (asset.url !== expectedAssetUrl) {
            throw new Error('Latest stable manifest asset has an unexpected API URL.');
          }

          const response = await fetch(asset.url, {
            headers: {
              Accept: 'application/octet-stream',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) {
            throw new Error(`Could not download latest stable manifest (HTTP ${response.status}).`);
          }
          const finalUrl = new URL(response.url);
          if (finalUrl.protocol !== 'https:'
            || (finalUrl.hostname !== 'api.github.com' && !finalUrl.hostname.endsWith('.githubusercontent.com'))) {
            throw new Error('Latest stable manifest download redirected to an unexpected host.');
          }
          const contentType = response.headers.get('content-type') ?? '';
          if (!/^(application\/(?:octet-stream|json)|application\/zip)(?:;|$)/i.test(contentType)) {
            throw new Error(`Latest stable manifest download returned unexpected content type ${contentType || '(missing)'}.`);
          }
          const bytes = Buffer.from(await response.arrayBuffer());
          if (bytes.length === 0 || (asset.size > 0 && bytes.length !== asset.size)) {
            throw new Error('Latest stable manifest download is empty or has an unexpected size.');
          }

          mkdirSync(dirname(process.env.ZIPPER_PREVIOUS_MANIFEST), { recursive: true });
          writeFileSync(process.env.ZIPPER_PREVIOUS_MANIFEST, bytes, { flag: 'wx' });
          appendFileSync(process.env.GITHUB_OUTPUT, 'has_previous=true\n');
          console.log(`Fetched catalog history from ${release.tag_name}.`);
          NODE

      - name: Package release and catalog manifest
        if: steps.preflight.outputs.publish == 'true'
        env:
          ZIPPER_VERSION: ${{ steps.preflight.outputs.version }}
          ZIPPER_RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          ZIPPER_HAS_PREVIOUS: ${{ steps.previous.outputs.has_previous }}
          ZIPPER_PREVIOUS_MANIFEST: ${{ runner.temp }}/zipper-release/previous-manifest.json
        shell: bash
        run: |
          args=(
            --version "$ZIPPER_VERSION"
            --output-dir artifacts
            --repository "$GITHUB_REPOSITORY"
            --release-tag "$ZIPPER_RELEASE_TAG"
          )
          if [[ "$ZIPPER_HAS_PREVIOUS" == "true" ]]; then
            args+=(--previous-manifest "$ZIPPER_PREVIOUS_MANIFEST")
          fi
          node scripts/package.mjs "${args[@]}"

      - name: Prepare release notes
        if: steps.preflight.outputs.publish == 'true'
        env:
          ZIPPER_VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';

          const metadata = JSON.parse(readFileSync('meta.json', 'utf8'));
          if (typeof metadata.changelog !== 'string' || metadata.changelog.trim().length === 0) {
            throw new Error('meta.json must provide release changelog text.');
          }
          mkdirSync('artifacts', { recursive: true });
          writeFileSync('artifacts/release-notes.md', `${metadata.changelog.trim()}\n`, 'utf8');
          NODE

      - name: Upload immutable prepared artifact
        if: steps.preflight.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zipper-release-${{ steps.preflight.outputs.sha }}
          path: |
            artifacts/Jellyfin.Plugin.Zipper_${{ steps.preflight.outputs.version }}.zip
            artifacts/manifest.json
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish prepared stable release
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZIPPER_REPOSITORY: ${{ github.repository }}
      ZIPPER_VERSION: ${{ needs.prepare.outputs.version }}
      ZIPPER_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      ZIPPER_SHA: ${{ needs.prepare.outputs.sha }}
      ZIPPER_GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download immutable prepared artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zipper-release-${{ needs.prepare.outputs.sha }}
          path: artifacts

      - name: Create or validate the release draft
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const repository = process.env.ZIPPER_REPOSITORY;
          const token = process.env.ZIPPER_GH_TOKEN;
          const tag = process.env.ZIPPER_RELEASE_TAG;
          const version = process.env.ZIPPER_VERSION;
          const sha = process.env.ZIPPER_SHA;
          const notes = readFileSync('artifacts/release-notes.md', 'utf8');
          const base = `https://api.github.com/repos/${repository}`;

          function fail(message) {
            throw new Error(message);
          }

          async function request(path, options = {}) {
            const response = await fetch(`${base}/${path}`, {
              method: options.method ?? 'GET',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.body ? { 'Content-Type': 'application/json' } : {}),
              },
              ...(options.body ? { body: JSON.stringify(options.body) } : {}),
            });
            if (response.status === 404) {
              return null;
            }
            if (!response.ok) {
              fail(`GitHub release API request failed with HTTP ${response.status}`);
            }
            return response.json();
          }

          async function getTagCommit(tag) {
            const reference = await request(`git/ref/tags/${encodeURIComponent(tag)}`);
            if (!reference) {
              return null;
            }
            let target = reference.object;
            let depth = 0;
            while (target?.type === 'tag') {
              if (depth >= 5) {
                fail(`Tag ${tag} has too many annotated tag layers.`);
              }
              const annotatedTag = await request(`git/tags/${target.sha}`);
              if (!annotatedTag) {
                fail(`Annotated tag ${tag} could not be resolved.`);
              }
              target = annotatedTag.object;
              depth += 1;
            }
            if (target?.type !== 'commit' || typeof target.sha !== 'string') {
              fail(`Tag ${tag} does not resolve to a commit.`);
            }
            return target.sha;
          }

          function setOutput(name, value) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }

          if (!/^\d+\.\d+\.\d+\.\d+$/.test(version ?? '') || tag !== `v${version}`) {
            fail('Prepared release version and tag do not match.');
          }
          if (!/^[a-f0-9]{40,64}$/i.test(sha ?? '')) {
            fail('Prepared release commit SHA is invalid.');
          }

          let release = await request(`releases/tags/${encodeURIComponent(tag)}`);
          if (release && !release.draft) {
            console.log(`Version ${version} was published by another run; this run will not change it.`);
            setOutput('skip', 'true');
            process.exit(0);
          }

          const taggedCommit = await getTagCommit(tag);
          if (release && !taggedCommit) {
            fail(`Draft release ${tag} has no resolvable Git tag.`);
          }
          if (taggedCommit && taggedCommit.toLowerCase() !== sha.toLowerCase()) {
            fail(`Tag ${tag} resolves to ${taggedCommit}, not prepared commit ${sha}.`);
          }

          if (!release) {
            if (!taggedCommit) {
              const createdRef = await request('git/refs', {
                method: 'POST',
                body: { ref: `refs/tags/${tag}`, sha },
              });
              if (createdRef?.ref !== `refs/tags/${tag}` || createdRef.object?.type !== 'commit'
                || createdRef.object?.sha?.toLowerCase() !== sha.toLowerCase()) {
                fail(`GitHub did not create tag ${tag} at prepared commit ${sha}.`);
              }
              const verifiedCommit = await getTagCommit(tag);
              if (!verifiedCommit || verifiedCommit.toLowerCase() !== sha.toLowerCase()) {
                fail(`New tag ${tag} does not resolve to prepared commit ${sha}.`);
              }
            }
            release = await request('releases', {
              method: 'POST',
              body: {
                tag_name: tag,
                target_commitish: sha,
                name: `Zipper ${version}`,
                body: notes,
                draft: true,
                prerelease: false,
              },
            });
            if (!release?.id || !release.draft || release.prerelease || release.tag_name !== tag) {
              fail('GitHub did not create the expected stable release draft.');
            }
          } else if (release.prerelease || release.tag_name !== tag) {
            fail(`Existing release ${tag} is not a stable draft for that tag.`);
          }

          setOutput('skip', 'false');
          setOutput('release_id', String(release.id));
          console.log(`Using draft release ${tag} for commit ${sha}.`);
          NODE

      - name: Refresh draft title and notes
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$ZIPPER_RELEASE_TAG" --title "Zipper $ZIPPER_VERSION" --notes-file artifacts/release-notes.md

      - name: Upload all release assets to the draft
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$ZIPPER_RELEASE_TAG"
          "artifacts/Jellyfin.Plugin.Zipper_${ZIPPER_VERSION}.zip"
          artifacts/manifest.json
          --clobber

      - name: Verify draft tag and complete asset set
        id: verify_draft
        if: steps.release.outputs.skip != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';

          const repository = process.env.ZIPPER_REPOSITORY;
          const token = process.env.ZIPPER_GH_TOKEN;
          const releaseId = process.env.RELEASE_ID;
          const tag = process.env.ZIPPER_RELEASE_TAG;
          const sha = process.env.ZIPPER_SHA;
          const version = process.env.ZIPPER_VERSION;

          async function getApi(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API request failed with HTTP ${response.status}`);
            }
            return response.json();
          }

          async function getTagCommit() {
            const reference = await getApi(`git/ref/tags/${encodeURIComponent(tag)}`);
            let target = reference.object;
            let depth = 0;
            while (target?.type === 'tag') {
              if (depth >= 5) {
                throw new Error(`Tag ${tag} has too many annotated tag layers.`);
              }
              const annotatedTag = await getApi(`git/tags/${target.sha}`);
              target = annotatedTag.object;
              depth += 1;
            }
            if (target?.type !== 'commit' || typeof target.sha !== 'string') {
              throw new Error(`Tag ${tag} does not resolve to a commit.`);
            }
            return target.sha;
          }

          if (!/^\d+$/.test(releaseId ?? '')) {
            throw new Error('Release draft ID is invalid.');
          }
          const [release, taggedCommit] = await Promise.all([
            getApi(`releases/${releaseId}`),
            getTagCommit(),
          ]);
          if (!release.draft || release.prerelease || release.tag_name !== tag) {
            throw new Error('Release must remain a draft for the expected stable tag until all assets are uploaded.');
          }
          if (taggedCommit.toLowerCase() !== sha.toLowerCase()) {
            throw new Error(`Tag ${tag} no longer resolves to prepared commit ${sha}.`);
          }

          const archiveName = `Jellyfin.Plugin.Zipper_${version}.zip`;
          function assetInfo(filename) {
            const bytes = readFileSync(`artifacts/${filename}`);
            return {
              size: bytes.length,
              digest: `sha256:${createHash('sha256').update(bytes).digest('hex')}`,
            };
          }
          const expected = new Map([
            [archiveName, assetInfo(archiveName)],
            ['manifest.json', assetInfo('manifest.json')],
          ]);
          if (expected.size !== 2 || [...expected.values()].some((asset) => asset.size <= 0)) {
            throw new Error('Prepared release assets are missing or empty.');
          }
          const assets = release.assets;
          if (assets.length !== expected.size) {
            throw new Error(`Draft has ${assets.length} assets; expected exactly ${expected.size}.`);
          }
          for (const asset of assets) {
            const prepared = expected.get(asset.name);
            if (asset.state !== 'uploaded' || !prepared || prepared.size !== asset.size
              || asset.digest !== prepared.digest) {
              throw new Error(`Draft contains an unexpected or incomplete asset: ${asset.name}.`);
            }
            expected.delete(asset.name);
          }
          if (expected.size !== 0) {
            throw new Error(`Draft is missing assets: ${[...expected.keys()].join(', ')}.`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          console.log(`Draft ${tag} contains the ZIP and catalog manifest for ${sha}.`);
          NODE
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}

      - name: Publish the complete draft release
        if: steps.release.outputs.skip != 'true' && steps.verify_draft.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$ZIPPER_RELEASE_TAG" --draft=false

      - name: Confirm the stable release was published
        if: steps.release.outputs.skip != 'true' && steps.verify_draft.outputs.ready == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const repository = process.env.ZIPPER_REPOSITORY;
          const token = process.env.ZIPPER_GH_TOKEN;
          const tag = process.env.ZIPPER_RELEASE_TAG;
          const sha = process.env.ZIPPER_SHA;
          const version = process.env.ZIPPER_VERSION;

          async function getApi(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API request failed with HTTP ${response.status}`);
            }
            return response.json();
          }

          async function getTagCommit() {
            const reference = await getApi(`git/ref/tags/${encodeURIComponent(tag)}`);
            let target = reference.object;
            let depth = 0;
            while (target?.type === 'tag') {
              if (depth >= 5) {
                throw new Error(`Tag ${tag} has too many annotated tag layers.`);
              }
              const annotatedTag = await getApi(`git/tags/${target.sha}`);
              target = annotatedTag.object;
              depth += 1;
            }
            if (target?.type !== 'commit' || typeof target.sha !== 'string') {
              throw new Error(`Tag ${tag} does not resolve to a commit.`);
            }
            return target.sha;
          }

          const release = await getApi(`releases/tags/${encodeURIComponent(tag)}`);
          const taggedCommit = await getTagCommit();
          if (release.draft || release.prerelease || release.tag_name !== tag) {
            throw new Error(`Release ${tag} is not published as a stable release.`);
          }
          if (taggedCommit.toLowerCase() !== sha.toLowerCase()) {
            throw new Error(`Published tag ${tag} does not resolve to triggering commit ${sha}.`);
          }
          const archiveName = `Jellyfin.Plugin.Zipper_${version}.zip`;
          const expected = new Map();
          for (const name of [archiveName, 'manifest.json']) {
            const bytes = readFileSync(`artifacts/${name}`);
            expected.set(name, {
              size: bytes.length,
              digest: `sha256:${createHash('sha256').update(bytes).digest('hex')}`,
            });
          }
          for (const asset of release.assets) {
            const prepared = expected.get(asset.name);
            if (asset.state !== 'uploaded' || !prepared || prepared.size !== asset.size
              || asset.digest !== prepared.digest) {
              throw new Error(`Published release contains an unexpected asset: ${asset.name}.`);
            }
            expected.delete(asset.name);
          }
          if (expected.size !== 0) {
            throw new Error(`Published release is missing assets: ${[...expected].join(', ')}.`);
          }
          console.log(`Published stable release ${tag} from ${sha} with its ZIP and catalog manifest.`);
          NODE
        env:
          ZIPPER_GH_TOKEN: ${{ github.token }}
